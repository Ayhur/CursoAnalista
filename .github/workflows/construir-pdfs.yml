name: Construir PDFs del curso

on:
  push:
    branches: [main]
    paths:
      - "curso/**"
      - "scripts/construir_material.py"
      - "scripts/construir_diagramas_moviles.py"
      - "recursos/diagramas-moviles/**"
      - ".github/workflows/construir-pdfs.yml"
  pull_request:
    paths:
      - "curso/**"
      - "scripts/construir_material.py"
      - "scripts/construir_diagramas_moviles.py"
      - "recursos/diagramas-moviles/**"
      - ".github/workflows/construir-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencia de PDF
        run: pip install reportlab
      - name: Comprobar fallbacks móviles y generar PDFs
        run: |
          python scripts/construir_diagramas_moviles.py --check
          python scripts/construir_material.py --all
      - name: Publicar descargas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: curso-analista-pdfs
          path: |
            dist/pdf/
            dist/markdown/
